<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Markdown Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--color-bg-page);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
        }
        body.preview-off { visibility: hidden; }

        /* ── WYSIWYG (Wordgard) editing surface ────────────────────────────
           Integrated with the host editor: borderless like CodeMirror, on the
           page background, with the app's text/caret/selection colors. */
        #wg-container {
            box-sizing: border-box;
            height: 100%;
            overflow: hidden;
        }
        #wg-container wordgard-editor {
            /* Wordgard theme variables → host app palette. Set on the editor
               element (not :root) so they beat Wordgard's own &light/&dark
               scoped values. */
            --wg-border-color: var(--color-border);
            --wg-menu-color: var(--color-text-secondary);
            --wg-highlight-color: var(--color-accent-light);
            --wg-panel-color: var(--color-surface-2);
            /* Sans-serif to match the app UI (prose markdown, not code). */
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-text-primary);
            caret-color: var(--color-text-primary);
            /* Remove Wordgard's default outer border (host editor is borderless). */
            border: none !important;
            background: transparent;
        }
        #wg-container ::selection,
        #wg-container ::-moz-selection {
            background-color: var(--color-selection-bg);
        }
        /* Editing surface: padding matches the host editor's comfortable inset. */
        #wg-container wg-content {
            padding: 8px 16px;
            caret-color: var(--color-text-primary);
        }

        /* ── Menu bar (formatting toolbar) ─────────────────────────────────
           Styled like the host editor footer: surface background, subtle bottom
           border, and compact ghost buttons that highlight on hover/active. */
        #wg-container wg-menubar {
            background: var(--color-surface-2);
            border-bottom: 1px solid var(--color-border);
            padding: 3px 8px;
            gap: 2px;
        }
        #wg-container .wg-menu-button {
            color: var(--color-text-secondary);
            border-radius: 4px;
        }
        #wg-container .wg-menu-button:hover {
            background: var(--color-surface-3);
            color: var(--color-text-primary);
        }
        #wg-container .wg-menu-button[aria-pressed] {
            color: var(--color-accent-light);
            background: var(--color-accent-bg);
        }

        /* Hide formatting that has no Markdown representation. These marks are
           dropped by the markdown serializer on round-trip, so offering them
           in the toolbar would let users create formatting that silently
           disappears when the preview is toggled off. Keep only features that
           serialize to Markdown (bold, italic, code, links, strikethrough,
           headings, lists, quotes, images) or are editor UI (undo/redo).

           The default Wordgard toolbar groups underline/superscript/subscript
           and the color pickers under a "More" submenu; after hiding those,
           "More" would only contain strikethrough, so it's removed entirely.
           Preview.js moves strikethrough out of it and up to the top-level bar
           (next to the other inline styles), so hiding "More" here is safe. */
        [title="More"],
        [title="Toggle underline"],
        [title="Toggle superscript"],
        [title="Toggle subscript"],
        [title="Text color"],
        [title="Background color"],
        [title="Alignment"],
        [title="Text direction"] {
            display: none !important;
        }
    </style>
</head>
<body class="preview-off">
    <!-- Loading/error UI is rendered by the host via the ui.* capability API. -->
    <script src="/host-client.js"></script>
    <script src="./lib/wordgard.js"></script>
    <script src="./serializer.js"></script>
    <script src="Preview.js"></script>
</body>
</html>
