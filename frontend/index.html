<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="AI-powered project management with task automation" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Board</title>
</head>
<body>
    <script nonce="{{.Nonce}}">
        // A theme stylesheet URL is storage's value, not ours, so only a file inside the
        // installed-extension tree may be painted before the app boots. This is
        // ui-injector.isPrepaintableThemeURL, rewritten because nothing can be imported
        // this early — change both. The dot-segment and percent-decoded halves carry the
        // weight: the browser turns "/extensions/a/b/../../../api/config" into a request
        // for "/api/config", and the server decodes "%2e%2e" into a dot segment before it
        // routes, so both spellings of ".." are refused in both forms.
        function _extAssetPath(u) {
            if (u.indexOf('/extensions/') !== 0) return false;
            if (/[\\?#\u0000-\u001f\u007f]/.test(u)) return false;
            var forms;
            try { forms = [u, decodeURIComponent(u)]; } catch (e) { return false; }
            for (var i = 0; i < forms.length; i++) {
                if (forms[i].indexOf('/extensions/') !== 0) return false;
                var segs = forms[i].slice('/extensions/'.length).split('/');
                if (segs.length < 2) return false;
                for (var j = 0; j < segs.length; j++) {
                    if (segs[j] === '' || segs[j] === '.' || segs[j] === '..') return false;
                }
            }
            return true;
        }
        try {
            var _t = localStorage.getItem('kanban-theme-css');
            if (_t && _extAssetPath(_t)) {
                var _l = document.createElement('link');
                _l.rel = 'stylesheet';
                _l.href = _t;
                _l.id = 'kanban-theme-stylesheet';
                document.head.appendChild(_l);
            }
        } catch(e) {}
        // Which language pack was active last time, so <html lang> is right on the
        // first frame instead of flipping after the app boots. Only the tag lives
        // here (the catalog itself is in IndexedDB, applied in main.ts) because
        // this is the one synchronous step; both are written together by
        // frontend/src/lib/i18n/cache.ts and cleared together when no pack is
        // enabled, so a pack that is gone cannot leave the document tagged with
        // its language. The server's extension list is still the real answer.
        try {
            var _g = localStorage.getItem('kanban-i18n-locale');
            if (_g && /^[A-Za-z0-9-]{2,35}$/.test(_g)) document.documentElement.lang = _g;
        } catch(e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
