<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="AI-powered project management with task automation" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Preconnect to API origin for faster WebSocket / API connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Kanban Board</title>
</head>
<body>
    <!-- Inject cached theme stylesheet before any rendering (zero-flash on return visits) -->
    <script>
        try {
            var _t = localStorage.getItem('kanban-theme-css');
            if (_t) {
                var _l = document.createElement('link');
                _l.rel = 'stylesheet';
                _l.href = _t;
                _l.id = 'kanban-theme-stylesheet';
                document.head.appendChild(_l);
            }
        } catch(e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
